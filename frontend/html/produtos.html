<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HEADER / BARRA DE NAVEGAÇÃO -->
<header>
    <div class="header-container">
        <!-- Logo do site -->
        <a href="home.html" class="logo">HES<span>Atacado</span></a>

        <nav>
            <!-- Ancoras do site -->
            <a href="home.html">Home</a>
            <a href="produtos.html" class="active">Produtos</a>
            <a href="home.html#contato">Contato</a>
        </nav>

        <!-- Botão de admin -->
        <a href="login.html" class="btn-admin">Admin</a>
    </div>
</header>

<!-- TÍTULO DA PÁGINA -->
<section class="capa">
    <div class="capa-content">
        <h1>Produtos</h1>
        <p>Conheça nossa linha completa de produtos</p>
        <!-- Descrição dos produtos -->
    </div>
</section>

<!-- FILTROS POR CATEGORIA -->
<section class="filtros">
    <div class="container">
        <div id="lista-categorias-filtro" class="categorias-filtro">
            <!-- Botão "Todos" sempre visível -->
            <button class="btn-filtro active" onclick="filtrarProdutos('all')">
                Todos
            </button>
            <!-- As categorias vão ser carregadas pelo JavaScript -->
        </div>
    </div>
</section>

<!-- LISTAGEM DE PRODUTOS -->
<section class="produtos-lista">
    <div class="container">
        <div class="produtos-grid" id="produtos-grid">
            <!-- Produtos carregados pelo JavaScript -->
        </div>
    </div>
</section>

<!-- RODAPÉ -->
<footer>
    <div class="footer-container">
        <p class="footer-logo">HES<span>Atacado</span></p>
        <p>Distribuição de produtos de limpeza</p>
        <p class="footer-copy">© 2026 HES. Todos os direitos reservados.</p>
    </div>
</footer>

<!-- Scripts -->
<script src="js/api.js"></script>
<script src="js/produtos.js"></script>

</body>
</html>
