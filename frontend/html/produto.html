<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HEADER / BARRA DE NAVEGAÇÃO -->
<header>
    <div class="header-container">
        <!-- Logo do site -->
        <a href="home.html" class="logo">HES<span>Atacado</span></a>

        <nav>
            <!-- Ancoras do site -->
            <a href="home.html">Home</a>
            <a href="produtos.html">Produtos</a>
            <a href="home.html#contato">Contato</a>
        </nav>

        <!-- Botão de admin -->
        <a href="login.html" class="btn-admin">Admin</a>
    </div>
</header>

<!-- DETALHES DO PRODUTO -->
<section class="produto-detalhes">
    <div class="container">
        <!-- Botão de voltar para a listagem -->
        <a href="produtos.html" class="voltar">← Voltar para produtos</a>

        <!-- Grid do produto (imagem + informações) -->
        <div class="produto-grid" id="produto-container">
            <!-- Carregado pelo JavaScript -->

            <div class="produto-loading">
                <p>Carregando detalhes do produto...</p>
            </div>
        </div>
    </div>
</section>

<!-- RODAPÉ -->
<footer>
    <div class="footer-container">
        <p class="footer-logo">HES<span>Atacado</span></p>
        <p class="footer-copy">© 2026 HES Atacado. Todos os direitos reservados.</p>
    </div>
</footer>

<!-- Scripts -->
<script src="js/api.js"></script>
<script src="js/produto.js"></script>

</body>
</html>
